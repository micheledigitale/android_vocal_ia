name: App Pixel (APK)

# Compila l'app "Assistente" per il Pixel e la allega come artefatto scaricabile.
on:
  push:
    paths:
      - "app_pixel/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compila APK di debug
        working-directory: app_pixel
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: assistente-apk
          path: app_pixel/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
